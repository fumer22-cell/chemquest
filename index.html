<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChemQuest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap"
    />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">ChemQuest</span>
          <span class="sub">pixel organic lab</span>
        </div>
        <section id="structure" aria-label="Molecules">
          <div class="slot" id="slot-work">
            <div class="mol"><canvas class="a"></canvas><canvas class="b"></canvas></div>
            <div class="meta">
              <div class="stage"></div>
              <div class="name"></div>
              <div class="formula"></div>
              <div class="mix"></div>
            </div>
          </div>
          <div class="effect" id="effect"></div>
          <div class="slot hand idle" id="slot-hand">
            <div class="mol"><canvas class="a"></canvas><canvas class="b"></canvas></div>
            <div class="meta">
              <div class="stage"></div>
              <div class="name"></div>
              <div class="formula"></div>
            </div>
          </div>
        </section>
        <nav class="modes" id="modes"></nav>
      </header>
      <main>
        <div class="stage-wrap">
          <canvas id="view"></canvas>
          <div id="tooltip" hidden></div>
          <div id="clock"></div>
        </div>
        <aside id="panel"></aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
